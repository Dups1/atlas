# Blueprint Render: servicio web del backend Node en backend-atlas/
# Ajusta el nombre del servicio si quieres. Variables de entorno siguen en el panel de Render.
services:
  - type: web
    name: backend-atlas
    runtime: node
    rootDir: backend-atlas
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
